<title>熱量手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: single phone-first column — budget ring, add panel, today's log, nutrients + water, week bars, body plan, saved QR foods */
:root {
  --bg: #f3f6f2;
  --surface: #ffffff;
  --line: #dde4dc;
  --fg: #1c2620;
  --muted: #627066;
  --accent: #1f6f5c;
  --accent-soft: #dcebe5;
  --water: #2f6fa8;
  --water-soft: #dde9f4;
  --over: #c8452f;
  --over-soft: #f6e0db;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Chivo Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121815; --surface: #1a221e; --line: #2c3832; --fg: #e6ece8; --muted: #93a39a;
    --accent: #5cc0a2; --accent-soft: #1f3a31; --water: #6fb0e8; --water-soft: #1d2f40;
    --over: #f07b64; --over-soft: #3d2420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121815; --surface: #1a221e; --line: #2c3832; --fg: #e6ece8; --muted: #93a39a;
  --accent: #5cc0a2; --accent-soft: #1f3a31; --water: #6fb0e8; --water-soft: #1d2f40;
  --over: #f07b64; --over-soft: #3d2420; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 500; letter-spacing: .08em; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; }
.datenav .label { min-width: 118px; text-align: center; font-weight: 500; }
.datenav .today { width: auto; padding-inline: 10px; font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }

.budget { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ring { width: 150px; height: 150px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .big { font-family: var(--font-num); font-size: 30px; font-weight: 600; line-height: 1.1; }
.ring .small { font-size: 12px; color: var(--muted); }
.stats { display: grid; grid-template-columns: auto auto; gap: 6px 16px; align-items: baseline; flex: 1; min-width: 180px; margin: 0; }
.stats dt { color: var(--muted); font-size: 13px; }
.stats dd { margin: 0; text-align: right; font-family: var(--font-num); }
.goal-edit { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.goal-edit input { width: 84px; text-align: right; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-family: var(--font-num); }
.over .big { color: var(--over); }

.tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; margin-bottom: 14px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 7px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

form { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 120px; min-width: 0; }
.row.tight > * { flex-basis: 90px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.f input, label.f select, .txt { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font-size: 15px; width: 100%; }
.btn { border: 0; background: var(--accent); color: var(--surface); padding: 10px 14px; border-radius: 9px; font-weight: 500; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
details.nutri > summary { font-size: 13px; color: var(--muted); cursor: pointer; padding: 2px 0; }
details.nutri[open] > summary { margin-bottom: 8px; }

.scan-drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.scan-drop.drag { border-color: var(--accent); background: var(--accent-soft); }
.qr-result { border-radius: 10px; background: var(--bg); padding: 12px; }
.qr-result a { color: var(--accent); word-break: break-all; font-weight: 500; }
.qr-result code { font-family: var(--font-num); font-size: 12px; word-break: break-all; color: var(--muted); }
.qr-result label.f input, .qr-result label.f select { background: var(--surface); }
.check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }

.meal + .meal { margin-top: 12px; }
.meal-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 4px; }
.entry { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.entry .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.entry .macro { display: block; font-size: 12px; color: var(--muted); }
.entry .tag { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; margin-left: 6px; white-space: nowrap; }
.entry .kcal { font-family: var(--font-num); }
.del { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; font-size: 18px; line-height: 1; }
.del:hover { background: var(--over-soft); color: var(--over); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; margin: 0; }

.nbars { display: flex; flex-direction: column; gap: 10px; }
.nbar .top { display: flex; justify-content: space-between; font-size: 13px; }
.nbar .top .num { color: var(--muted); }
.track { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; margin-top: 4px; }
.track span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.nbar.over .track span { background: var(--over); }
.nbar.over .top .num { color: var(--over); }

.water-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.water-head .big { font-family: var(--font-num); font-size: 26px; font-weight: 600; color: var(--water); }
.cups { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 12px 0; }
.cup { aspect-ratio: 3 / 4; max-width: 100%; border: 1.5px solid var(--water); border-radius: 3px 3px 8px 8px; position: relative; overflow: hidden; }
.cup span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--water); opacity: .75; }
.water-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.water-btns button { flex: 1 1 70px; border: 0; border-radius: 9px; padding: 9px 6px; background: var(--water-soft); color: var(--water); font-weight: 500; }

.week svg { width: 100%; height: auto; display: block; }
.week text { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.week .bar { fill: var(--accent); }
.week .bar.over { fill: var(--over); }
.week .bar.sel { stroke: var(--fg); stroke-width: 1.5; }
.week .goal { stroke: var(--muted); stroke-dasharray: 4 4; }

details.plan > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.plan > summary::-webkit-details-marker { display: none; }
details.plan > summary h2 { margin: 0; }
details.plan > summary .sum { font-size: 13px; color: var(--muted); }
details.plan[open] > summary { margin-bottom: 14px; }
.result { margin-top: 14px; border-radius: 10px; background: var(--accent-soft); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.result .headline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.result .headline .big { font-family: var(--font-num); font-size: 28px; font-weight: 600; color: var(--accent); }
.result dl { display: grid; grid-template-columns: auto auto; gap: 4px 16px; margin: 0; font-size: 13px; }
.result dt { color: var(--muted); }
.result dd { margin: 0; text-align: right; font-family: var(--font-num); }
.warn { font-size: 13px; color: var(--over); margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 14px; }
.chip .add { border: 0; background: var(--accent); color: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.chip .x { border: 0; background: transparent; color: var(--muted); font-size: 16px; padding: 0 4px; }

.banner { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--over-soft); color: var(--fg); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 10; }
@media (prefers-reduced-motion: no-preference) {
  .ring circle.val { transition: stroke-dashoffset .4s ease; }
  .track span, .cup span { transition: width .3s ease, height .3s ease; }
}
</style>

<div class="wrap">
  <header>
    <h1>熱量手帳</h1>
    <div class="datenav">
      <button id="prev" aria-label="前一天">‹</button>
      <span class="label" id="dateLabel"></span>
      <button id="next" aria-label="後一天">›</button>
      <button id="today" class="today">今天</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="panel">
    <div class="budget" id="budget">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent-soft)" stroke-width="12"></circle>
          <circle class="val" id="ringVal" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
        </svg>
        <div class="center"><span class="big" id="remain">0</span><span class="small" id="remainLabel">kcal 剩餘</span></div>
      </div>
      <dl class="stats">
        <dt>已吃</dt><dd id="eaten">0 kcal</dd>
        <dt>每日目標</dt>
        <dd><div class="goal-edit"><input id="goal" type="number" inputmode="numeric" min="800" max="6000" step="50" aria-label="每日熱量目標"><span>kcal</span></div></dd>
        <dt>喝水</dt><dd id="waterStat">0 ml</dd>
      </dl>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabManual" aria-selected="true">手動輸入</button>
      <button role="tab" id="tabScan" aria-selected="false">掃 QR code</button>
    </div>

    <form id="manualForm">
      <label class="f">食物<input id="mName" required maxlength="60" placeholder="例如：雞腿便當"></label>
      <div class="row">
        <label class="f">熱量 (kcal)<input id="mKcal" type="number" inputmode="decimal" min="0" max="5000" step="any" required placeholder="0"></label>
        <label class="f">餐別<select id="mMeal"></select></label>
      </div>
      <div id="mNutriSlot"></div>
      <div class="row" id="mAiRow" hidden>
        <button type="button" class="btn ghost" id="estimateBtn">用名稱估算</button>
        <button type="button" class="btn ghost" id="labelBtn" hidden>拍營養標示</button>
        <input id="labelFile" type="file" accept="image/*" hidden>
      </div>
      <p class="hint" id="mNote" hidden></p>
      <button type="submit" class="btn">加入紀錄</button>
    </form>

    <div id="scanPane" hidden>
      <div class="scan-drop" id="drop">
        <button type="button" class="btn" id="scanBtn">拍照或選擇 QR code 照片</button>
        <input id="qrFile" type="file" accept="image/*" capture="environment" hidden>
        <p class="hint">手機會直接開相機。也可以把截圖拖到這裡或貼上。</p>
      </div>
      <details style="margin-top:10px">
        <summary class="hint" style="cursor:pointer">無法辨識？手動貼上 QR 內容</summary>
        <div class="row" style="margin-top:8px">
          <input id="qrText" class="txt" placeholder="貼上網址或文字">
          <button type="button" class="btn ghost" id="qrTextBtn" style="flex:0 0 auto">使用</button>
        </div>
      </details>
      <form id="qrForm" class="qr-result" hidden style="margin-top:12px"></form>
      <input id="shotFile" type="file" accept="image/*" hidden>
    </div>
  </section>

  <section class="panel">
    <h2 id="logTitle">今天吃了什麼</h2>
    <div id="log"></div>
  </section>

  <section class="panel">
    <h2>營養成分</h2>
    <div class="nbars" id="nbars"></div>
    <p class="hint" id="nbarsNote" style="margin-top:10px"></p>
  </section>

  <section class="panel">
    <div class="water-head">
      <h2 style="margin:0">喝水</h2>
      <span><span class="big" id="waterMl">0</span> <span class="num hint" id="waterGoalLbl">/ 2000 ml</span></span>
    </div>
    <div class="cups" id="cups" aria-hidden="true"></div>
    <div class="water-btns">
      <button id="w250">+250 ml</button>
      <button id="w500">+500 ml</button>
      <button id="w100">+100 ml</button>
      <button id="wUndo">−250 ml</button>
    </div>
  </section>

  <section class="panel week">
    <h2>最近 7 天熱量</h2>
    <svg id="weekSvg" viewBox="0 0 340 150" role="img" aria-label="最近七天熱量"></svg>
  </section>

  <section class="panel">
    <details class="plan" id="planBox">
      <summary><h2>我的身體與目標</h2><span class="sum" id="planSum">設定後自動算出每日建議熱量 ›</span></summary>
      <form id="planForm">
        <div class="row tight">
          <label class="f">性別<select id="pSex"><option value="f">女</option><option value="m">男</option></select></label>
          <label class="f">年齡<input id="pAge" type="number" inputmode="numeric" min="10" max="100" placeholder="20"></label>
          <label class="f">身高 (cm)<input id="pHeight" type="number" inputmode="decimal" min="100" max="230" step="0.1" placeholder="165"></label>
        </div>
        <div class="row tight">
          <label class="f">目前體重 (kg)<input id="pWeight" type="number" inputmode="decimal" min="25" max="300" step="0.1" placeholder="60"></label>
          <label class="f">目標體重 (kg)<input id="pTarget" type="number" inputmode="decimal" min="25" max="300" step="0.1" placeholder="55"></label>
        </div>
        <label class="f">活動量<select id="pActivity">
          <option value="1.2">久坐，幾乎不運動</option>
          <option value="1.375" selected>輕度，每週運動 1–3 天</option>
          <option value="1.55">中度，每週運動 3–5 天</option>
          <option value="1.725">高度，每週運動 6–7 天</option>
        </select></label>
        <label class="f">速度<select id="pPace">
          <option value="0.25">慢慢來，每週約 0.25 kg</option>
          <option value="0.5" selected>建議，每週約 0.5 kg</option>
          <option value="0.75">積極，每週約 0.75 kg</option>
        </select></label>
      </form>
      <div class="result" id="planResult" hidden></div>
    </details>
  </section>

  <section class="panel">
    <h2>已記住的 QR 食物</h2>
    <div class="chips" id="chips"></div>
  </section>

  <section class="panel" id="backupPanel" hidden>
    <h2>備份</h2>
    <p class="hint">紀錄只存在這個瀏覽器。換手機或清除瀏覽器資料前，先匯出備份檔，之後再匯入就能接著用。</p>
    <div class="row" style="margin-top:10px">
      <button type="button" class="btn ghost" id="exportBtn">匯出備份</button>
      <button type="button" class="btn ghost" id="importBtn">匯入備份</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <div class="row" id="importConfirm" hidden style="margin-top:10px">
      <p class="warn" id="importMsg" style="flex-basis:100%"></p>
      <button type="button" class="btn" id="importYes">取代目前的紀錄</button>
      <button type="button" class="btn ghost" id="importNo">取消</button>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const MEALS = ["早餐", "午餐", "晚餐", "點心"];
// Taiwan nutrition label fields
const NUTRI = [
  { key: "protein", label: "蛋白質", unit: "g" },
  { key: "fat", label: "脂肪", unit: "g" },
  { key: "carbs", label: "碳水化合物", unit: "g" },
  { key: "sugar", label: "糖", unit: "g" },
  { key: "sodium", label: "鈉", unit: "mg" },
];
const $ = (id) => document.getElementById(id);
const state = { goal: 2000, waterGoal: 2000, body: null, days: {}, qr: {}, date: dayKey(new Date()), mode: "loading" };
let resolveStore;
const storeReady = new Promise((r) => (resolveStore = r));
const save = (fn) => storeReady.then(fn);
let sample = null, canImages = false;
let pendingQr = null;

/* ---------- helpers ---------- */
function dayKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function parseKey(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function shiftKey(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return dayKey(d); }
function defaultMeal() {
  const hr = new Date().getHours();
  return hr < 10 ? "早餐" : hr < 14 ? "午餐" : hr < 17 ? "點心" : hr < 21 ? "晚餐" : "點心";
}
function qrId(code) {
  let x = 0x811c9dc5;
  for (let i = 0; i < code.length; i++) { x ^= code.charCodeAt(i); x = Math.imul(x, 0x01000193); }
  return "q" + (x >>> 0).toString(16) + code.length.toString(16);
}
const day = (k) => state.days[k] || { entries: [], water: 0 };
const r1 = (v) => Math.round(v * 10) / 10;
function total(k) { return day(k).entries.reduce((s, e) => s + (Number(e.kcal) || 0), 0); }
function nutriTotal(k, key) { return day(k).entries.reduce((s, e) => s + (Number(e.n && e.n[key]) || 0), 0); }
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) el.append(c);
  return el;
}
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
}
function writeError(e) {
  if (e && e.code === "quota_exceeded") toast("儲存空間已滿，請刪除一些舊紀錄");
  else if (e && e.code === "invalid_argument") toast("無法儲存：你對這個頁面只有檢視權限");
  else toast("儲存失敗，請稍後再試");
}
function sampleError(e) {
  if (e && e.code === "not_granted") { $("mAiRow").hidden = true; sample = null; return "已關閉 Claude 讀取功能，請手動輸入"; }
  if (e && e.code === "rate_limited") return "太頻繁了，稍等一下再試";
  return "讀取失敗，請手動輸入";
}

/* ---------- daily calorie plan (Mifflin-St Jeor) ---------- */
function plan(b) {
  if (!b || !(b.age > 0 && b.height > 0 && b.weight > 0)) return null;
  const bmr = 10 * b.weight + 6.25 * b.height - 5 * b.age + (b.sex === "m" ? 5 : -161);
  const tdee = bmr * b.activity;
  const floor = b.sex === "m" ? 1500 : 1200;
  const target = b.target > 0 ? b.target : b.weight;
  const diff = target - b.weight;
  const notes = [];
  let goal = tdee;
  let mode = "keep";
  if (diff <= -0.5) {
    mode = "lose";
    const wanted = b.pace * 1100;             // 1 kg fat ≈ 7700 kcal, so 0.5 kg/week ≈ 550 kcal/day
    const capped = Math.min(wanted, tdee * 0.25);
    if (capped < wanted) notes.push("為了安全，每天最多比消耗量少吃 25%，所以速度會比你選的慢一點。");
    goal = tdee - capped;
    if (goal < floor) { goal = floor; notes.push((b.sex === "m" ? "男性" : "女性") + "每天建議不低於 " + floor + " kcal，想再快一點可以增加活動量。"); }
  } else if (diff >= 0.5) {
    mode = "gain";
    goal = tdee + Math.min(b.pace * 1100, 500);
  }
  goal = Math.round(goal / 50) * 50;
  const rate = Math.abs(goal - tdee) * 7 / 7700;   // kg per week
  const weeks = mode !== "keep" && rate > 0.05 ? Math.ceil(Math.abs(diff) / rate) : null;
  const bmi = b.weight / (b.height / 100) ** 2;
  const tbmi = target / (b.height / 100) ** 2;
  if (tbmi < 18.5) notes.push("目標體重的 BMI 是 " + r1(tbmi) + "，低於 18.5 屬於過輕，建議先和醫師或營養師討論。");
  if (b.age < 18) notes.push("未滿 18 歲還在發育，這個公式可能低估需求，請不要過度節食。");
  const water = Math.round(b.weight * 35 / 100) * 100;
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), goal, mode, rate, weeks, bmi, tbmi, water, notes, diff };
}
// Daily nutrient targets: protein 20%, fat 30%, carbs 50% of kcal; added sugar < 10% kcal; sodium < 2400 mg
function nutriTargets() {
  const g = state.goal;
  return { protein: g * 0.2 / 4, fat: g * 0.3 / 9, carbs: g * 0.5 / 4, sugar: g * 0.1 / 4, sodium: 2400 };
}

/* ---------- storage: your account (db) or this browser only ---------- */
function makeRemoteStore(db, uid) {
  const profile = db.doc("data/users/" + uid + "/profile");
  const days = profile.collection("days");
  const qrs = profile.collection("qrfoods");
  const chains = {};
  const serial = (key, fn) => (chains[key] = (chains[key] || Promise.resolve()).then(fn).catch(writeError));
  profile.onSnapshot((s) => {
    if (s.exists) {
      const d = s.data();
      state.goal = Number(d.goal) || 2000;
      state.waterGoal = Number(d.waterGoal) || 2000;
      state.body = d.body || null;
      fillPlanForm();
    }
    render();
  }, () => {});
  days.onSnapshot((qs) => {
    const next = {};
    qs.docs.forEach((d) => { const v = d.data(); next[d.id] = { entries: v.entries || [], water: Number(v.water) || 0 }; });
    state.days = next; render();
  }, () => {});
  qrs.onSnapshot((qs) => {
    const next = {};
    qs.docs.forEach((d) => (next[d.id] = d.data()));
    state.qr = next; render();
  }, () => {});
  return {
    saveProfile: () => serial("profile", () => profile.set({ goal: state.goal, waterGoal: state.waterGoal, body: state.body })),
    saveDay: (k) => serial("day-" + k, () => {
      const d = day(k);
      return d.entries.length || d.water ? days.doc(k).set({ entries: d.entries, water: d.water }) : days.doc(k).delete();
    }),
    saveQr: (id) => serial("qr-" + id, () => qrs.doc(id).set(state.qr[id])),
    deleteQr: (id) => serial("qr-" + id, () => qrs.doc(id).delete()),
  };
}
function makeLocalStore() {
  const KEY = "kcal-diary-v1";
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved) {
      const days = {};
      for (const [k, v] of Object.entries(saved.days || {})) days[k] = Array.isArray(v) ? { entries: v, water: 0 } : v;
      Object.assign(state, { goal: saved.goal || 2000, waterGoal: saved.waterGoal || 2000, body: saved.body || null, days, qr: saved.qr || {} });
      fillPlanForm();
    }
  } catch (e) {}
  const persist = () => {
    try { localStorage.setItem(KEY, JSON.stringify(snapshot())); } catch (e) { toast("無法儲存：這個瀏覽器封鎖了網站資料"); }
  };
  // ask the browser not to clear this site's data when space runs low
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  return { saveProfile: persist, saveDay: persist, saveQr: persist, deleteQr: persist };
}
function snapshot() {

function renderWeek() {
  const svg = $("weekSvg"), NS = "http://www.w3.org/2000/svg";
  svg.replaceChildren();
  const keys = Array.from({ length: 7 }, (_, i) => shiftKey(state.date, i - 6));
  const vals = keys.map(total);
  const max = Math.max(state.goal, ...vals) * 1.12;
  const top = 18, base = 122, H = base - top, slot = 340 / 7, bw = 26;
  const y = (v) => base - (v / max) * H;
  const mk = (tag, a) => { const el = document.createElementNS(NS, tag); for (const k in a) el.setAttribute(k, a[k]); return el; };
  keys.forEach((k, i) => {
    const x = i * slot + (slot - bw) / 2, v = vals[i];
    if (v > 0) {
      svg.append(mk("rect", { x, y: y(v), width: bw, height: base - y(v), rx: 4, class: "bar" + (v > state.goal ? " over" : "") + (k === state.date ? " sel" : "") }));
      const t = mk("text", { x: x + bw / 2, y: y(v) - 5, "text-anchor": "middle" }); t.textContent = v; svg.append(t);
    }
    const d = parseKey(k);
    const lab = mk("text", { x: x + bw / 2, y: 140, "text-anchor": "middle" });
    lab.textContent = (d.getMonth() + 1) + "/" + d.getDate();
    if (k === state.date) lab.setAttribute("style", "fill:var(--fg);font-weight:600");
    svg.append(lab);
  });
  svg.append(mk("line", { x1: 0, x2: 340, y1: y(state.goal), y2: y(state.goal), class: "goal" }));
  const gl = mk("text", { x: 338, y: y(state.goal) - 4, "text-anchor": "end" }); gl.textContent = "目標 " + state.goal; svg.append(gl);
}

/* ---------- QR ---------- */
async function decodeFile(file) {
  if (typeof jsQR !== "function") { toast("QR 辨識元件載入失敗，請重新整理"); return; }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
    for (const maxSide of [1000, 1600, 600]) {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const r = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "attemptBoth" });
      if (r && r.data) { showQr(r.data); return; }
    }
    toast("照片裡找不到 QR code，靠近一點再拍一次");
  } catch (e) {
    toast("無法讀取這張照片");
  } finally { URL.revokeObjectURL(url); }
}

function showQr(code) {
  code = code.trim(); if (!code) return;
  const id = qrId(code), known = state.qr[id];
  pendingQr = { code, id };
  const form = $("qrForm"); form.replaceChildren(); form.hidden = false;
  const isUrl = /^https?:\/\//i.test(code);
  const fields = [
    h("div", { class: "row" },
      h("label", { class: "f" }, "食物", h("input", { id: "qName", required: true, maxlength: 60, value: known ? known.name : null, placeholder: "例如：鮪魚飯糰" })),
      h("label", { class: "f" }, "熱量 (kcal)", h("input", { id: "qKcal", type: "number", inputmode: "decimal", min: 0, max: 5000, step: "any", required: true, value: known ? known.kcal : null, placeholder: "0" }))),
    nutriFields("q", known && known.n, !known),
    mealSelect("qMeal"),
  ];
  if (known) {
    form.append(h("strong", {}, "認得這個 QR code"), ...fields,
      h("label", { class: "check" }, h("input", { type: "checkbox", id: "qRemember", checked: true }), "如果有修改，更新記住的數值"));
  } else {
    form.append(
      h("strong", {}, "第一次掃到這個 QR code"),
      h("p", { class: "hint" }, isUrl ? "1. 點開連結，登入學校帳號查看熱量和營養成分。" : "QR code 內容如下，請填入食物資料。"),
      isUrl ? h("a", { href: code, target: "_blank", rel: "noopener noreferrer" }, "開啟學校頁面 ↗") : null,
      h("code", {}, code),
      canImages ? h("div", { class: "row" },
        h("p", { class: "hint", style: "flex-basis:100%" }, "2. 在學校頁面截圖，上傳後 Claude 會幫你把數字填好："),
        h("button", { type: "button", class: "btn ghost", id: "shotBtn", onclick: () => $("shotFile").click() }, "上傳截圖自動填入")) : null,
      h("p", { class: "hint" }, canImages ? "或直接手動填寫：" : "2. 把數字填到下面："),
      ...fields,
      h("p", { class: "hint", id: "qNote", hidden: true }),
      h("label", { class: "check" }, h("input", { type: "checkbox", id: "qRemember", checked: true }), "記住這個 QR code，下次掃描自動帶入"));
  }
  form.append(h("button", { type: "submit", class: "btn" }, "加入紀錄"));
  form.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function mealSelect(id) {
  const s = h("select", { id }); MEALS.forEach((m) => s.append(h("option", { value: m }, m))); s.value = defaultMeal();
  return h("label", { class: "f" }, "餐別", s);
}

/* ---------- wiring ---------- */
function wire() {
  const sel = $("mMeal"); MEALS.forEach((m) => sel.append(h("option", { value: m }, m))); sel.value = defaultMeal();
  $("mNutriSlot").append(nutriFields("m"));
  $("prev").onclick = () => { state.date = shiftKey(state.date, -1); render(); };
  $("next").onclick = () => { state.date = shiftKey(state.date, 1); render(); };
  $("today").onclick = () => { state.date = dayKey(new Date()); render(); };
  $("goal").onchange = () => {
    const v = Math.round(Number($("goal").value));
    if (v >= 800 && v <= 6000) { state.goal = v; render(); save((s) => s.saveProfile()); }
    else { $("goal").value = state.goal; toast("目標請設在 800–6000 kcal 之間"); }
  };
  const setTab = (scan) => {
    $("tabManual").setAttribute("aria-selected", String(!scan)); $("tabScan").setAttribute("aria-selected", String(scan));
    $("manualForm").hidden = scan; $("scanPane").hidden = !scan;
  };
  $("tabManual").onclick = () => setTab(false);
  $("tabScan").onclick = () => setTab(true);

  $("manualForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("mName").value.trim(), kcal = Math.round(Number($("mKcal").value));
    if (!name || !(kcal >= 0)) return;
    addEntry({ name, kcal, meal: $("mMeal").value, n: readNutri("m") });
    $("mName").value = ""; $("mKcal").value = ""; fillNutri("m", {});
    $("mNutriSlot").querySelector("details").open = false; $("mNote").hidden = true;
  });

  $("estimateBtn").onclick = () => {
    const name = $("mName").value.trim();
    if (!name) { toast("先輸入食物名稱"); $("mName").focus(); return; }
    busy($("estimateBtn"), "估算中…", async () => {
      try {
        applyReading(await estimateByName(name), "mName", "mKcal", "m", "mNote");
        $("mNote").textContent = "這是估算值，有營養標示的話以標示為準。";
      } catch (e) { toast(sampleError(e)); }
    });
  };
  $("labelBtn").onclick = () => $("labelFile").click();
  $("labelFile").onchange = (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    busy($("labelBtn"), "讀取中…", async () => {
      try { applyReading(await readImage(f), "mName", "mKcal", "m", "mNote"); } catch (err) { toast(sampleError(err)); }
    });
  };
  $("shotFile").onchange = (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f || !$("shotBtn")) return;
    busy($("shotBtn"), "讀取中…", async () => {
      try { applyReading(await readImage(f), "qName", "qKcal", "q", "qNote"); } catch (err) { toast(sampleError(err)); }
    });
  };

  $("scanBtn").onclick = () => $("qrFile").click();
  $("qrFile").onchange = (e) => { const f = e.target.files[0]; if (f) decodeFile(f); e.target.value = ""; };
  const drop = $("drop");
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) decodeFile(f); });
  document.addEventListener("paste", (e) => {
    if ($("scanPane").hidden) return;
    const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
    if (!f) return;
    // a pasted image is a QR photo until a QR form waiting for a screenshot is open
    if (pendingQr && !state.qr[pendingQr.id] && $("shotBtn") && canImages) {
      busy($("shotBtn"), "讀取中…", async () => {
        try { applyReading(await readImage(f), "qName", "qKcal", "q", "qNote"); } catch (err) { toast(sampleError(err)); }
      });
    } else decodeFile(f);
  });
  $("qrTextBtn").onclick = () => showQr($("qrText").value);

  $("qrForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!pendingQr) return;
    const name = $("qName").value.trim(), kcal = Math.round(Number($("qKcal").value));
    if (!name || !(kcal >= 0)) return;
    const n = readNutri("q");
    const { id, code } = pendingQr, prev = state.qr[id];
    if ($("qRemember").checked) {
      const item = { code, name, kcal, used: ((prev && prev.used) || 0) + 1 };
      if (Object.keys(n).length) item.n = n;
      state.qr = { ...state.qr, [id]: item };
      save((s) => s.saveQr(id));
    }
    addEntry({ name, kcal, meal: $("qMeal").value, qr: true, n });
    $("qrForm").hidden = true; pendingQr = null;
  });

  $("w250").onclick = () => addWater(250);
  $("w500").onclick = () => addWater(500);
  $("w100").onclick = () => addWater(100);
  $("wUndo").onclick = () => addWater(-250);

  $("exportBtn").onclick = exportBackup;
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) readBackup(f); };
  $("importYes").onclick = applyImport;
  $("importNo").onclick = () => { pendingImport = null; $("importConfirm").hidden = true; };

  $("planForm").addEventListener("input", renderPlan);
  $("planForm").addEventListener("submit", (e) => e.preventDefault());
}

async function init() {
  wire(); render();
  const C = window.claude;
  const [db, user, smp] = C ? await Promise.all([C.use("db"), C.use("user"), C.use("sample")]) : [null, null, null];
  const uid = user ? await user.id() : null;
  if (db && uid) {
    resolveStore(makeRemoteStore(db, uid)); state.mode = "remote";
  } else {
    resolveStore(makeLocalStore()); state.mode = "local";
    // inside a Claude viewer but signed out: say how to get sync; standalone (GitHub Pages): just the backup panel
    if (C) {
      const b = $("banner"); b.hidden = false;
      b.textContent = "目前沒有登入 Claude，紀錄只會存在這個瀏覽器。登入後打開這個頁面，紀錄就會存進你的帳號，換手機或電腦也看得到。";
    } else $("backupPanel").hidden = false;
  }
  if (smp) {
    sample = smp; $("mAiRow").hidden = false;
    const lim = await smp.limits().catch(() => null);
    canImages = !!(lim && lim.images);
    $("labelBtn").hidden = !canImages;
  }
  if (!state.body) $("planBox").open = true;
  render();
}
init();
</script>
